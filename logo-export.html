<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8"/>
<style>
  body { background: #060912; display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; font-family: "Inter Tight", system-ui, sans-serif; gap: 48px; flex-wrap: wrap; }
  .logo { display: flex; align-items: center; gap: 8px; }
  .brand-strad { color: #ff7a3d; font-weight: 700; font-size: 28px; letter-spacing: 0.04em; }
  .brand-it { color: #f5f7fb; font-weight: 700; font-size: 28px; letter-spacing: 0.04em; }
  .icon-only { padding: 32px; background: #0a1020; border-radius: 16px; }
  .full-logo { padding: 32px 48px; background: #0a1020; border-radius: 16px; }
</style>
</head>
<body>

  <!-- Icon only -->
  <div class="icon-only">
    <svg width="48" height="48" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
      <polygon points="12,3 20,7.5 20,16.5 12,21 4,16.5 4,7.5" fill="#ff7a3d" stroke="#ff7a3d" stroke-width="1.2"/>
      <circle cx="12" cy="12" r="2.8" fill="#ffffff"/>
      <line x1="12" y1="9.2" x2="12" y2="3.5" stroke="#ffffff" stroke-width="1.6" stroke-linecap="round"/>
      <line x1="14.4" y1="13.4" x2="19.5" y2="16.2" stroke="#ffffff" stroke-width="1.6" stroke-linecap="round"/>
      <line x1="9.6" y1="13.4" x2="4.5" y2="16.2" stroke="#ffffff" stroke-width="1.6" stroke-linecap="round"/>
    </svg>
  </div>

  <!-- Full logo -->
  <div class="full-logo">
    <div class="logo">
      <svg width="36" height="36" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <polygon points="12,3 20,7.5 20,16.5 12,21 4,16.5 4,7.5" fill="#ff7a3d" stroke="#ff7a3d" stroke-width="1.2"/>
        <circle cx="12" cy="12" r="2.8" fill="#ffffff"/>
        <line x1="12" y1="9.2" x2="12" y2="3.5" stroke="#ffffff" stroke-width="1.6" stroke-linecap="round"/>
        <line x1="14.4" y1="13.4" x2="19.5" y2="16.2" stroke="#ffffff" stroke-width="1.6" stroke-linecap="round"/>
        <line x1="9.6" y1="13.4" x2="4.5" y2="16.2" stroke="#ffffff" stroke-width="1.6" stroke-linecap="round"/>
      </svg>
      <span class="brand-strad">STRAD</span><span class="brand-it">IT</span>
    </div>
  </div>

</body>
</html>
